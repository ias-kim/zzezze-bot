name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod # Go 버전의 원천은 go.mod 하나

      # gofmt, vet, build, test -race, 계층 검사, arm64 크로스 빌드 (Makefile 참고)
      - name: make check
        run: make check
