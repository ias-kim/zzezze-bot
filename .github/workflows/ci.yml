name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod # Go 버전의 원천은 go.mod 하나

      # 검사 항목은 Makefile 의 check 타깃이 원천 (여기에 목록을 복사하지 않는다)
      - name: make check
        run: make check
